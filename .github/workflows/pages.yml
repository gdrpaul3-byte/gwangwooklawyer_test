name: Publish to gh-pages

# GitHub Pages 는 gh-pages 브랜치에서 서비스됩니다.
# main 에 push 하면 같은 내용을 gh-pages 로 복사해 자동 배포합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to gh-pages
        run: git push --force origin HEAD:gh-pages
